<!DOCTYPE html>
<html>
<head>
    <title>Geode Pages</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
        }
        .card {
            background: white;
            padding: 60px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.2);
        }
        h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        p { color: #666; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Geode Pages</h1>
        <p>AI-powered page hosting</p>
    </div>
</body>
</html>
